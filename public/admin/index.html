<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración</title>
    <script src="https://cdn.netlify.com/identity/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Carga la app de Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
  if (window.location.hash && window.location.hash.includes('invite_token')) {
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { netlifyIdentity.open('signup'); }, 500);
    });
  }
</script>

  </body>
</html>
